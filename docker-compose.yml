version: "3.8"

services:
  postgres:
    image: postgres:latest
    container_name: code-together-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-your_db_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${DB_NAME:-your_database_name}
    volumes:
      - ./pg_data:/var/lib/postgresql
    networks:
      - code-together-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-your_db_user} -d ${DB_NAME:-your_database_name}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: code-together-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 9080
      DEBUG: "true"
      DATABASE_URL: postgres://${DB_USER:-your_db_user}:${DB_PASSWORD:-your_secure_password}@postgres:5432/${DB_NAME:-your_database_name}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-CHANGE_THIS_TO_A_SECURE_RANDOM_STRING}
    networks:
      - code-together-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:9080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No external port mapping in dev mode - use manager as entry point

  manager:
    build:
      context: ./manager
      dockerfile: Dockerfile
    container_name: code-together-manager
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    networks:
      - code-together-network
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  code-together-network:
    driver: bridge
