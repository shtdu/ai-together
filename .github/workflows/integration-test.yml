name: Integration Test

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allow manual triggering

jobs:
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codetogether_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'manager/pnpm-lock.yaml'

      - name: Create test environment file
        working-directory: ./integration
        run: |
          cat > .env.test << EOF
          # Test server URL
          TEST_SERVER_URL=http://localhost:8088

          # Database
          TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/codetogether_test?sslmode=disable
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/codetogether_test?sslmode=disable

          # Security
          JWT_SECRET=default_secret_key_for_development
          LICENSE_PUBLIC_KEY=+ftu10SQxIREoOQ3lHpJl0tr2pnPtuBVJCUbcRMDQKw=

          # Server configuration
          PORT=8088
          DEBUG=true
          EOF

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "✓ PostgreSQL is ready"

      - name: Run integration tests
        working-directory: ./integration
        run: |
          set -a && source .env.test && set +a
          go test -v github.com/code-together/integration
        env:
          CGO_ENABLED: 0

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            integration/*.log
          retention-days: 7
