name: Integration Test

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'integration/**'
      - '.github/workflows/integration-test.yml'
  workflow_dispatch: # Allow manual triggering

jobs:
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codetogether_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: |
            integration/go.sum
            server/go.sum
            shared/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'manager/pnpm-lock.yaml'

      - name: Create test environment file
        working-directory: ./integration
        run: |
          cat > .env.test << EOF
          # Test server URL
          TEST_SERVER_URL=http://localhost:8088

          # Database
          TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/codetogether_test?sslmode=disable
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/codetogether_test?sslmode=disable

          # Security
          JWT_SECRET=default_secret_key_for_development
          LICENSE_PUBLIC_KEY=+ftu10SQxIREoOQ3lHpJl0tr2pnPtuBVJCUbcRMDQKw=

          # Server configuration
          PORT=8088
          DEBUG=true
          EOF

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "✓ PostgreSQL is ready"

      - name: Run integration tests
        working-directory: ./integration
        run: |
          ./integration-test.sh
        env:
          CGO_ENABLED: 0
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          SERVER_LOG_PATH: /tmp/integration-test-server.log

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./integration/coverage.out
          flags: integration
          name: integration-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            /tmp/integration-test-server.log
          retention-days: 7
