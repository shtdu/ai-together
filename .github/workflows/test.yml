name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      shared: ${{ steps.filter.outputs.shared }}
      member: ${{ steps.filter.outputs.member }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - '.github/workflows/test.yml'
              - 'server/**'
              - 'shared/**'
            shared:
              - '.github/workflows/test.yml'
              - 'shared/**'
            member:
              - '.github/workflows/test.yml'
              - 'member/**'
              - 'shared/**'

  go-test:
    name: Go Test
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Run server tests
        working-directory: ./server
        run: go test -v ./...

      - name: Generate coverage report
        working-directory: ./server
        run: |
          go test $(go list ./... | grep -v -E 'scripts|internal/db|repository|testutil|shared/integration') -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./server/coverage.out
          flags: server
          name: server-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  shared-test:
    name: Shared Test
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: shared/go.sum

      - name: Run shared tests
        working-directory: ./shared
        run: go test -v ./...

      - name: Generate coverage report
        working-directory: ./shared
        run: go test -coverprofile=coverage.out -covermode=atomic ./... || echo "Coverage generation had warnings"
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./shared/coverage.out
          flags: shared
          name: shared-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  member-test:
    name: Member Test
    needs: changes
    if: needs.changes.outputs.member == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: |
            member/go.sum
            shared/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: member/frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        working-directory: member/frontend
        run: npm install

      - name: Build frontend assets (production)
        working-directory: member/frontend
        run: npm run build
        env:
          PRODUCTION: 'true'

      - name: Go mod tidy
        working-directory: member
        run: go mod tidy

      - name: Run tests without coverage
        working-directory: member
        run: go test -v  ./...

      # - name: Run tests with coverage
      #   working-directory: member
      #   run: go test -v -coverprofile=coverage.out -covermode=atomic ./... || echo "Coverage generation had warnings"
      #   continue-on-error: true

      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: ./member/coverage.out
      #     flags: member
      #     name: member-coverage
      #     fail_ci_if_error: false
      #     token: ${{ secrets.CODECOV_TOKEN }}
