name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false

      - name: Run server tests
        working-directory: ./server
        run: go test -v ./...

      - name: Generate coverage report
        working-directory: ./server
        run: |
          go test $(go list ./... | grep -v -E 'scripts|internal/db|repository|testutil') -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./server/coverage.out
          flags: server
          name: server-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  member-test:
    name: Member Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        working-directory: member/frontend
        run: npm install

      - name: Build frontend assets (production)
        working-directory: member/frontend
        run: npm run build
        env:
          PRODUCTION: 'true'

      - name: Go mod tidy
        working-directory: member
        run: go mod tidy

      - name: Run tests
        working-directory: member
        run: go test -v ./...
