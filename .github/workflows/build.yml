name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      member: ${{ steps.filter.outputs.member }}
      manager: ${{ steps.filter.outputs.manager }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - '.github/workflows/build.yml'
              - 'server/**'
              - 'shared/**'
            member:
              - '.github/workflows/build.yml'
              - 'member/**'
              - 'shared/**'
            manager:
              - '.github/workflows/build.yml'
              - 'manager/**'

  server-build:
    name: Server Build
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify build
        run: |
          go build -v ./...
          echo "✓ Server builds successfully"

  member-build:
    name: Member Build
    needs: changes
    if: needs.changes.outputs.member == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: |
            member/go.sum
            shared/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: member/frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        working-directory: member/frontend
        run: npm install

      - name: Build frontend assets (production)
        working-directory: member/frontend
        run: npm run build
        env:
          PRODUCTION: 'true'

      - name: Go mod tidy
        working-directory: member
        run: go mod tidy

      - name: Download Go dependencies
        working-directory: member
        run: go mod download

      - name: Verify member build
        working-directory: member
        run: |
          go build -v ./...
          echo "✓ member builds successfully"

  manager-build:
    name: Manager Build
    needs: changes
    if: needs.changes.outputs.manager == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'manager/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build manager UI
        run: pnpm build
        env:
          CI: true

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build output directory not found"
            exit 1
          fi
          echo "✓ Manager UI builds successfully"
