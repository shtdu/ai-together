name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  server-build:
    name: Server Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Verify build
        run: |
          go build -v ./...
          echo "✓ Server builds successfully"

  member-build:
    name: Member Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./member
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: ../member/frontend
        run: npm install

      - name: Build frontend assets (production)
        working-directory: ../member/frontend
        run: npm run build
        env:
          PRODUCTION: 'true'

      - name: Go mod tidy
        run: go mod tidy

      - name: Download Go dependencies
        run: go mod download

      - name: Verify member build
        run: |
          go build -v -o bin/CodeTogether ./...
          echo "✓ member builds successfully"

  manager-build:
    name: Manager Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'manager/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build manager UI
        run: pnpm build
        env:
          CI: true

      - name: Verify build output
        run: |
          if [ ! -d "manager/dist" ]; then
            echo "Build output directory not found"
            exit 1
          fi
          echo "✓ Manager UI builds successfully"
