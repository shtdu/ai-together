name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      member: ${{ steps.filter.outputs.member }}
      manager: ${{ steps.filter.outputs.manager }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - '.github/workflows/lint.yml'
              - 'server/**'
              - 'shared/**'
            member:
              - '.github/workflows/lint.yml'
              - 'member/**'
              - 'shared/**'
            manager:
              - '.github/workflows/lint.yml'
              - 'manager/**'

  server-lint:
    name: Server Lint
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Check formatting
        working-directory: ./server
        run: |
          fmt_output=$(go fmt ./...)
          if [ -n "$fmt_output" ]; then
            echo "The following files need formatting:"
            echo "$fmt_output"
            exit 1
          fi
          echo "✓ Go code is properly formatted"

      - name: Run go vet
        working-directory: ./server
        run: |
          go vet ./...
          echo "✓ Go vet passed"

  member-lint:
    name: Member Lint
    needs: changes
    if: needs.changes.outputs.member == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./member
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: |
            member/go.sum
            shared/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: member/frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        working-directory: member/frontend
        run: npm install

      - name: Build frontend assets (production)
        working-directory: member/frontend
        run: npm run build
        env:
          PRODUCTION: 'true'

      - name: Go mod tidy
        run: go mod tidy

      - name: Check formatting
        run: |
          fmt_output=$(go fmt ./...)
          if [ -n "$fmt_output" ]; then
            echo "The following files need formatting:"
            echo "$fmt_output"
            exit 1
          fi
          echo "✓ Go code is properly formatted"

      - name: Run go vet
        run: |
          go vet ./...
          echo "✓ Go vet passed"

      - name: Run frontend ESLint
        working-directory: member/frontend
        run: npm run lint

  typescript-lint:
    name: TypeScript Lint
    needs: changes
    if: needs.changes.outputs.manager == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'manager/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./manager
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: ./manager
        run: pnpm lint
        env:
          CI: true
