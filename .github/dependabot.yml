version: 2
updates:

  # Server Go module
  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
      - "server"

  # Member Go module
  - package-ecosystem: "gomod"
    directory: "/member"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
      - "member"

  # Integration Go module
  - package-ecosystem: "gomod"
    directory: "/integration"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go"
      - "integration"

  # Manager npm package
  - package-ecosystem: "npm"
    directory: "/manager"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "javascript"
    versioning-strategy: patch

  # Member frontend npm package
  - package-ecosystem: "npm"
    directory: "/member/frontend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "javascript"
      - "member"
    versioning-strategy: patch
