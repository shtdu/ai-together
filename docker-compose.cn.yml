# Docker Compose for China Users (using docker.gh-proxy.com)
# 中国用户专用配置（使用 docker.gh-proxy.com 镜像代理）
#
# 使用稳定的 Docker 镜像代理服务，无需配置 Docker daemon
# 原理：docker.gh-proxy.com 会代理 Docker Hub 的镜像请求

version: "3.8"

services:
  postgres:
    # 使用 docker.gh-proxy.com 代理 Docker Hub
    # 原始地址: postgres:latest
    # 代理地址: docker.gh-proxy.com/library/postgres:latest
    image: docker.gh-proxy.com/library/postgres:latest
    container_name: code-together-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-your_db_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${DB_NAME:-your_database_name}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - code-together-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-your_db_user} -d ${DB_NAME:-your_database_name}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    # 使用 docker.gh-proxy.com 代理 Docker Hub
    # 原始地址: cnjax/code-together-server:latest
    # 代理地址: docker.gh-proxy.com/cnjax/code-together-server:latest
    # 如果需要本地构建，取消注释以下几行并注释掉 image 行：
    # build:
    #   context: .
    #   dockerfile: ./server/Dockerfile
    image: docker.gh-proxy.com/cnjax/code-together-server:${IMAGE_TAG:-latest}
    container_name: code-together-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 9080
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgres://${DB_USER:-your_db_user}:${DB_PASSWORD:-your_secure_password}@postgres:5432/${DB_NAME:-your_database_name}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - please set it in .env file}
    networks:
      - code-together-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:9080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  manager:
    # 使用 docker.gh-proxy.com 代理 Docker Hub
    # 原始地址: cnjax/code-together-manager:latest
    # 代理地址: docker.gh-proxy.com/cnjax/code-together-manager:latest
    image: docker.gh-proxy.com/cnjax/code-together-manager:${IMAGE_TAG:-latest}
    container_name: code-together-manager
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    networks:
      - code-together-network
    ports:
      # 只暴露管理界面端口 - 同时提供 UI 和 API 代理
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    driver: local

networks:
  code-together-network:
    driver: bridge
