  /api/v1/usage/batch:
    post:
      tags:
        - Usage
      summary: Batch upload usage records
      description: Upload multiple usage records in a single batch request. Validates that all records belong to the authenticated user's tenant and user account. Returns the count of successfully synced records and any errors that occurred.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UsageRecord'
              description: Array of usage records to sync
              example:
                - platform: "claude"
                  model: "claude-3-sonnet-20240229"
                  provider: "Anthropic Provider"
                  http_code: 200
                  input_tokens: 120
                  output_tokens: 50
                  tenant_id: 1
                  user_id: 1
                  created_at: "2023-10-20T14:30:00Z"
      responses:
        '200':
          description: Batch upload processed (may include partial failures)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUsageResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Internal server error - all records failed to sync
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUsageResponse'

