  /api/v1/license:
    get:
      tags:
        - License
      summary: Get license status
      description: |
        Retrieves the current license status, usage statistics, and tier information
        for the authenticated user's tenant. Returns default license (tier 0.0) if
        no valid license is active. Available to all authenticated users (managers and members).
      responses:
        '200':
          description: License details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseStatusResponse'
              examples:
                withActiveLicense:
                  summary: Response with active license
                  value:
                    license:
                      customer_name: "Acme Corporation"
                      license_id: "CL-2024-001"
                      tier: "1.0"
                      tier_name: "Standard"
                      seats: 10
                      max_providers_per_kind: -1
                      issued_at: "2024-01-15T00:00:00Z"
                      expires_at: "2025-01-15T00:00:00Z"
                    usage:
                      current_users: 5
                      seats_remaining: 5
                      provider_counts:
                        claude: 3
                        codex: 1
                        opencode: 0
                    status:
                      has_active_license: true
                      days_remaining: 180
                      can_add_user: true
                      can_add_provider:
                        claude: true
                        codex: true
                        opencode: true
                withDefaultLicense:
                  summary: Response with default license
                  value:
                    license:
                      customer_name: "My Company"
                      license_id: null
                      tier: "0.0"
                      tier_name: "Community"
                      seats: 3
                      max_providers_per_kind: 2
                      issued_at: null
                      expires_at: null
                    usage:
                      current_users: 1
                      seats_remaining: 2
                      provider_counts:
                        claude: 1
                    status:
                      has_active_license: false
                      is_using_defaults: true
                      days_remaining: 0
                      can_add_user: true
                      can_add_provider:
                        claude: true
                        codex: true
                        opencode: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/license/activate:
    post:
      tags:
        - License
      summary: Activate license
      description: |
        Activates or upgrades a license by validating and storing a new license key.
        Requires manager-level permissions. The license key must be signed with the
        corresponding private key and contain valid tier and seat information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateLicenseRequest'
            example:
              license_key: "-----BEGIN LICENSE KEY-----\nMIIB...\n-----END LICENSE KEY-----"
      responses:
        '200':
          description: License activated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "License activated successfully"
        '400':
          description: Invalid license key or license data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidSignature:
                  summary: Invalid signature
                  value:
                    error: "invalid license key: signature verification failed"
                expiredLicense:
                  summary: Expired license
                  value:
                    error: "license has expired"
                invalidData:
                  summary: Invalid license data
                  value:
                    error: "invalid license data: tier is required"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden - managers only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tiers:
    get:
      tags:
        - License
      summary: Get available license tiers
      description: |
        Returns information about all available license tiers including their names,
        limits, and features. This endpoint does not require authentication.
      security: []
      responses:
        '200':
          description: Tier information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiers:
                    type: array
                    items:
                      $ref: '#/components/schemas/LicenseTier'
              example:
                tiers:
                  - tier: "0.0"
                    name: "Community"
                    max_providers_per_kind: 2
                    features:
                      - "Basic provider management"
                  - tier: "1.0"
                    name: "Standard"
                    max_providers_per_kind: -1
                    features:
                      - "Unlimited providers"
                      - "Basic analytics"
                  - tier: "2.0"
                    name: "Professional"
                    max_providers_per_kind: -1
                    features:
                      - "Unlimited providers"
                      - "Full analytics"
                      - "Team management"
                  - tier: "3.0"
                    name: "Enterprise"
                    max_providers_per_kind: -1
                    features:
                      - "Unlimited providers"
                      - "Full analytics"
                      - "SSO integration"
                      - "Audit logs"
