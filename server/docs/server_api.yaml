                  provider_name:
                    type: string
                    example: "OpenAI GPT-4"
                  total_requests:
                    type: integer
                    example: 500
                  total_input_tokens:
                    type: integer
                    example: 50000
                  total_output_tokens:
                    type: integer
                    example: 25000
                  period_start:
                    type: string
                    format: date-time
                    example: "2023-10-01T00:00:00Z"
